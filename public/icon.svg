<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="peGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer Shape (Maskable Safe-zone friendly background) -->
  <rect width="512" height="512" rx="128" fill="#1e1b4b" />
  
  <!-- Glowing circular background -->
  <circle cx="256" cy="256" r="180" fill="url(#peGrad)" opacity="0.15" />
  
  <!-- Main Icon Elements with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main circular gradient border representing tracking/stadium -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#peGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Stopwatch / Whistle stylized shape inside -->
    <path d="M256 160 V190 M230 140 H282" stroke="url(#peGrad)" stroke-width="20" stroke-linecap="round" />
    <circle cx="256" cy="256" r="85" fill="none" stroke="url(#peGrad)" stroke-width="18" />
    
    <!-- Stopwatch hand -->
    <line x1="256" y1="256" x2="295" y2="217" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
    <circle cx="256" cy="256" r="15" fill="#f59e0b" />
    
    <!-- Runners dynamic ribbon / tracks -->
    <path d="M160 380 Q 256 310 352 380" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
